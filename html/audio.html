<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Audio Level</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #181818;
            color: #eee;
        }

        .meter {
            width: 600px;
            height: 50px;
            background: #333;
            border-radius: 6px;
            overflow: hidden;
            margin: 20px 0;
        }

        #bar {
            height: 100%;
            width: 0%;
            background: #00d26a;
            transition: none;
        }

        #value {
            font-size: 24px;
            font-family: monospace;
        }

        #status {
            font-family: monospace;
            margin-bottom: 20px;
        }

        #log {
            width: 600px;
            height: 300px;
            overflow: auto;
            background: #000;
            padding: 10px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <div id="status">CONNECTING...</div>

    <div class="meter">
        <div id="bar"></div>
    </div>

    <div id="value">0.000</div>

    <div id="log"></div>


    <script>
        "use strict";

        const WS_URL = "ws://localhost:8080/ws-audio/0";

        const status = document.getElementById("status");
        const bar = document.getElementById("bar");
        const value = document.getElementById("value");
        const log = document.getElementById("log");


        /*
         * ============================================================
         * DEBUG
         * ============================================================
         *
         * Для минимальной latency оставляем false.
         *
         * При true логирование ограничено и не выполняется
         * на каждом WebSocket message.
         */
        const DEBUG = false;


        function logMessage(text) {
            if (!DEBUG) {
                return;
            }

            const line = document.createElement("div");
            line.textContent = text;

            log.appendChild(line);

            /*
             * Не позволяем логу бесконечно расти.
             */
            while (log.childNodes.length > 100) {
                log.removeChild(log.firstChild);
            }

            log.scrollTop = log.scrollHeight;
        }


        /*
         * ============================================================
         * LATEST VALUE
         * ============================================================
         *
         * WebSocket может получать значения чаще, чем браузер
         * физически способен отрисовывать.
         *
         * Поэтому мы НЕ пытаемся отрисовать каждое сообщение.
         *
         * Здесь всегда хранится только самое свежее значение.
         */
        let latestLevel = 0.0;


        /*
         * ============================================================
         * WEBSOCKET
         * ============================================================
         */

        const ws = new WebSocket(WS_URL, "ws-audio");


        ws.onopen = function () {
            status.textContent = "CONNECTED";
            status.style.color = "#00d26a";

            logMessage("WebSocket connected");
        };


        ws.onerror = function (event) {
            status.textContent = "ERROR";
            status.style.color = "red";

            logMessage("WebSocket error");

            console.error(event);
        };


        ws.onclose = function (event) {
            status.textContent =
                `CLOSED code=${event.code} reason=${event.reason}`;

            status.style.color = "red";

            logMessage(
                `WebSocket closed: code=${event.code}`
            );
        };


        /*
         * ============================================================
         * WEBSOCKET MESSAGE
         * ============================================================
         *
         * Здесь НЕТ:
         *
         *   - async
         *   - await
         *   - DOM logging
         *   - prepend()
         *   - обновления bar
         *
         * Мы только принимаем последнее значение.
         */
        ws.onmessage = function (event) {

            /*
             * Сервер отправляет:
             *
             * LWS_WRITE_TEXT
             *
             * поэтому ожидаем string.
             */
            if (typeof event.data !== "string") {
                return;
            }


            let message;

            try {
                message = JSON.parse(event.data);
            }
            catch (e) {
                return;
            }


            if (!("level" in message)) {
                return;
            }


            const level = Number(message.level);

            if (!Number.isFinite(level)) {
                return;
            }


            /*
             * Просто сохраняем последнее значение.
             *
             * Если сервер прислал:
             *
             * 10
             * 11
             * 12
             * 13
             *
             * а браузер ещё занят отрисовкой,
             * нам нужен только 13.
             */
            latestLevel = level;
        };


        /*
         * ============================================================
         * NORMALIZE LEVEL
         * ============================================================
         *
         * Поддерживаются два варианта сервера:
         *
         * 1. level = 0..1
         *
         * 2. level = dB, например -60..0
         */
        function normalizeLevel(level) {

            /*
             * Server sends 0..1
             */
            if (level >= 0 && level <= 1) {
                return level;
            }


            /*
             * Server sends dB
             */
            if (level <= 0) {

                return Math.max(
                    0,
                    Math.min(
                        1,
                        (level + 60) / 60
                    )
                );
            }


            return 0;
        }


        /*
         * ============================================================
         * RENDER
         * ============================================================
         *
         * requestAnimationFrame синхронизирует обновление с
         * rendering pipeline браузера.
         *
         * Главное:
         *
         * WebSocket может получать хоть 1000 сообщений/сек,
         * но на экран мы выводим только самое последнее значение.
         */
        function render() {

            const level = latestLevel;

            const normalized = normalizeLevel(level);


            /*
             * Обновляем meter.
             */
            bar.style.width =
                `${normalized * 100}%`;


            /*
             * Обновляем текст.
             */
            if (level >= 0 && level <= 1) {

                value.textContent =
                    level.toFixed(3);

            }
            else if (level <= 0) {

                value.textContent =
                    `${level.toFixed(2)} dB`;

            }
            else {

                value.textContent = "0";
            }


            /*
             * Следующий frame.
             */
            requestAnimationFrame(render);
        }


        /*
         * Запускаем rendering loop.
         */
        requestAnimationFrame(render);

    </script>

</body>
</html>
