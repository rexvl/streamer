<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stream Manager</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">Stream Manager</div>
      <div class="sidebar-actions">
        <button id="btn-dashboard" class="small">Dashboard</button>
        <button id="btn-new-stream" class="small">+ New Stream</button>
      </div>
      <ul id="stream-list"></ul>
      <div class="sidebar-footer">Local Control Panel</div>
    </aside>

    <main id="main-area">
      <section id="dashboard-view" class="view">
        <h2>Dashboard</h2>
        <div id="global-metrics" class="metrics-row">
          <div>Active: <span id="metric-active">0</span></div>
          <div>Total Out: <span id="metric-bitrate">0</span> kbps</div>
          <div>CPU: <span id="metric-cpu">0</span>%</div>
          <div>GPU: <span id="metric-gpu">0</span>%</div>
          <div>Upload: <span id="metric-net">0</span> kbps</div>
          <div>Dropped: <span id="metric-dropped">0</span></div>
        </div>

        <table id="dashboard-table">
          <thead>
            <tr><th>Name</th><th>Status</th><th>Uptime</th><th>Resolution</th><th>Bitrate</th><th>Outputs</th><th>Health</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section id="stream-view" class="view hidden">
        <div id="status-bar"></div>
        <div id="stream-content">
          <div class="left-col">
            <div class="card" id="video-settings">
              <h3>Video</h3>
              <div id="sources-list"></div>
              <div class="video-preview">Preview (16:9)</div>
            </div>
            <div class="card" id="audio-settings">
              <h3>Audio</h3>
              <div id="audio-list"></div>
            </div>
          </div>
          <div class="right-col">
            <div class="card" id="outputs">
              <h3>Outputs</h3>
              <div id="outputs-list"></div>
              <div class="outputs-actions">
                <button id="btn-add-output" class="small">Add Output</button>
              </div>
            </div>
            <div class="card" id="controls">
              <h3>Controls</h3>
              <div class="control-buttons">
                <button id="btn-start">Start</button>
                <button id="btn-stop">Stop</button>
                <button id="btn-restart">Reconnect</button>
                <button id="btn-delete-stream" class="danger">Delete Stream</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
